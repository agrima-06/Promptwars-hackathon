<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182E" />
      <stop offset="50%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#031020" />
    </linearGradient>

    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFA84A" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#0E6B05" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanDataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Base Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Tricolor Concentric Arcs -->
  <!-- Saffron Top Arc -->
  <path d="M 12 60 A 48 48 0 0 1 108 60" fill="none" stroke="url(#saffronGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Green Bottom Arc -->
  <path d="M 108 60 A 48 48 0 0 1 12 60" fill="none" stroke="url(#greenGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Outer Orbit Track & Constellation Data Nodes -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Orbital Data Nodes (Digital Census) -->
  <circle cx="60" cy="18" r="3" fill="#FF9933" filter="url(#glow)" />
  <circle cx="102" cy="60" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="60" cy="102" r="3" fill="#22C55E" filter="url(#glow)" />
  <circle cx="18" cy="60" r="3" fill="#F59E0B" filter="url(#glow)" />
  
  <circle cx="30" cy="30" r="2" fill="#38BDF8" opacity="0.8" />
  <circle cx="90" cy="30" r="2" fill="#FCD34D" opacity="0.8" />
  <circle cx="90" cy="90" r="2" fill="#22C55E" opacity="0.8" />
  <circle cx="30" cy="90" r="2" fill="#38BDF8" opacity="0.8" />

  <!-- Ashoka Chakra 24 Spokes Geometric Structure -->
  <g transform="translate(60, 60)" opacity="0.4">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38BDF8" stroke-width="1" />
    <!-- 24 Spokes generated geometrically -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="-21.21" y1="-21.21" x2="21.21" y2="21.21" stroke="#38BDF8" stroke-width="0.8" />
    <line x1="21.21" y1="-21.21" x2="-21.21" y2="21.21" stroke="#38BDF8" stroke-width="0.8" />
    
    <line x1="-27.71" y1="-11.49" x2="27.71" y2="11.49" stroke="#38BDF8" stroke-width="0.6" />
    <line x1="-11.49" y1="-27.71" x2="11.49" y2="27.71" stroke="#38BDF8" stroke-width="0.6" />
    <line x1="11.49" y1="-27.71" x2="-11.49" y2="27.71" stroke="#38BDF8" stroke-width="0.6" />
    <line x1="27.71" y1="-11.49" x2="-27.71" y2="11.49" stroke="#38BDF8" stroke-width="0.6" />
    
    <line x1="-29.54" y1="-5.21" x2="29.54" y2="5.21" stroke="#38BDF8" stroke-width="0.5" opacity="0.6" />
    <line x1="-5.21" y1="-29.54" x2="5.21" y2="29.54" stroke="#38BDF8" stroke-width="0.5" opacity="0.6" />
    <line x1="5.21" y1="-29.54" x2="-5.21" y2="29.54" stroke="#38BDF8" stroke-width="0.5" opacity="0.6" />
    <line x1="29.54" y1="-5.21" x2="-29.54" y2="5.21" stroke="#38BDF8" stroke-width="0.5" opacity="0.6" />
  </g>

  <!-- Central Security & Data Shield -->
  <path d="M 60 32 L 80 40 C 80 58 60 74 60 74 C 60 74 40 58 40 40 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        filter="url(#glow)" />

  <!-- "Jan" (People) Stylized Figure Inside Shield -->
  <!-- Central Head -->
  <circle cx="60" cy="46" r="4.5" fill="#FFFFFF" />
  <!-- Central Body / Shoulders -->
  <path d="M 52 61 C 52 54 68 54 68 61 Z" fill="url(#saffronGrad)" />

  <!-- Left Supporting Citizen -->
  <circle cx="50" cy="49" r="3.2" fill="#E2E8F0" opacity="0.9" />
  <path d="M 44 61 C 44 55 54 55 54 61 Z" fill="url(#cyanDataGrad)" opacity="0.85" />

  <!-- Right Supporting Citizen -->
  <circle cx="70" cy="49" r="3.2" fill="#E2E8F0" opacity="0.9" />
  <path d="M 66 61 C 66 55 76 55 76 61 Z" fill="url(#greenGrad)" opacity="0.85" />

  <!-- Digital Data Pulse & Interconnect Lines -->
  <path d="M 40 60 L 32 60 L 26 52 M 80 60 L 88 60 L 94 68" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
  <circle cx="26" cy="52" r="1.8" fill="#38BDF8" />
  <circle cx="94" cy="68" r="1.8" fill="#38BDF8" />

  <!-- Lower Ribbon Branding Monogram -->
  <rect x="42" y="78" width="36" height="13" rx="3" fill="#0B1E3B" stroke="url(#goldGrad)" stroke-width="1" />
  <text x="60" y="87.5" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JANDATA</text>
  <circle cx="45" cy="84.5" r="1.2" fill="#FF9933" />
  <circle cx="75" cy="84.5" r="1.2" fill="#22C55E" />
</svg>
